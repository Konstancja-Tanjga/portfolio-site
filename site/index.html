    <script>
      // The skin before first paint, so a dark skin never flashes white.
      (function () {
        try {
          var s = localStorage.getItem("kt-skin");
          var skins = { deco: "dark", blueprint: "dark", aquarelle: "light" };
          if (!skins[s]) s = "deco";
          document.documentElement.setAttribute("data-skin", s);
          document.documentElement.setAttribute("data-theme", skins[s]);
        } catch (e) {}
      })();
    </script>
