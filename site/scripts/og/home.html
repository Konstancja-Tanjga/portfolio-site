<!doctype html>
<!--

  of their own: 1200 x 630, the 1.91:1 that LinkedIn, X, Slack and

-->
<html lang="en">
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Bricolage+Grotesque:opsz,wght@12..96,800&family=IBM+Plex+Mono:wght@500&display=block" rel="stylesheet" />
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #0f0f0e;
    color: #f1ede4;
    font-family: Inter, sans-serif;

  .text { position: absolute; left: 72px; top: 64px; width: 560px; }
  .role {
    font: 500 15px/1 "IBM Plex Mono", monospace;

  }
  .role b { color: #e3d2ad; font-weight: 500; }

    margin-top: 30px;
    font: 800 66px/0.98 "Bricolage Grotesque", sans-serif;

    position: absolute; left: 72px; bottom: 56px;
    display: flex; align-items: center; gap: 20px;
  }
  .cta {
    background: #e3d2ad; color: #0f0f0e;
    font: 500 20px/1 Inter, sans-serif;
    padding: 14px 22px; border-radius: 999px;

</head>
<body>
  <div class="text">
    <p class="role"><b>Konstancja Tanjga-Nawrot</b> · Lead Designer, UX Engineer</p>

  <div class="foot">
