# What has to be true before a change reaches main.
#
# The deploy workflow already builds the site, but only after a merge — which
# makes the first place a broken build shows up the published page. This runs
# the same build on every pull request and on every branch that is not main,
# plus the two checks a build cannot make: that every asset a wall points at
# exists, and that the site's token layer still states no colour of its own.
name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

# A second push to the same branch supersedes the first rather than racing it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json

      # The design system installs from GitHub rather than npm, so this needs
      # the git that actions/checkout leaves behind.
      - run: npm ci

      - name: Assets resolve, and the site layer declares no colour
        run: npm run check

      # tsc -b then vite build, the same pair the deploy runs. BASE_PATH is
      # deliberately unset: a build that only works under the Pages prefix is
      # a build nobody can run locally.
      - name: Typecheck and build
        run: npm run build
